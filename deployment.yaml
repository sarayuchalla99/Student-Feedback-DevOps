apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-feedback
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-feedback
  template:
    metadata:
      labels:
        app: student-feedback
    spec:
      containers:
        - name: student-feedback
          image: sarayuchalla/student-feedback:latest
          ports:
            - containerPort: 5000
