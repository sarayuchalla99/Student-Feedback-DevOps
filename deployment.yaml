apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-feedback
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-feedback
  template:
    metadata:
      labels:
        app: student-feedback
    spec:
      containers:
        - name: student-feedback
          image: YOUR_DOCKERHUB_USERNAME/student-feedback:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
